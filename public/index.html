<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Movie Collection</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 50px 24px;
      background: #f4f4f4;
      color: #000;
    }
    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border-radius: 12px;
    }
    h1 { text-align: center; font-size: 36px; margin: 20px 0 24px; }
    h2 { font-size: 28px; margin: 24px 0; }
    form { display: flex; gap: 16px; padding: 4px 6px; }
    input, button {
      font: 16px Arial, sans-serif;
      padding: 12px;
      border: 1px solid #888;
      border-radius: 2px;
    }
    input { width: 206px; min-width: 0; background: #fff; }
    button { background: #eee; color: #000; cursor: pointer; white-space: nowrap; }
    button:hover { background: #e2e2e2; }
    button:focus-visible, input:focus-visible { outline: 2px solid #555; outline-offset: 2px; }
    #load-movies { margin: 4px 6px 12px; }
    #success, .error { margin: 12px 0 0; font-size: 18px; font-weight: bold; }
    #success:empty, .error:empty { display: none; }
    .error { color: #d32f2f; }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 18px; }
    th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
    th { background: #eee; }
    .empty { text-align: center; color: #888; }
    @media (max-width: 760px) {
      body { padding: 20px 12px; }
      main { padding: 20px; }
      h1 { font-size: 30px; }
      form { flex-wrap: wrap; padding: 0; }
      input { flex: 1 1 180px; }
      #load-movies { margin-left: 0; }
    }
  </style>
</head>
<body>
  <main>
  <h1>Movie Collection</h1>

  <h2>Add Movie</h2>
  <form id="movie-form">
    <input type="text" id="title" aria-label="Title" placeholder="Title" required />
    <input type="text" id="genre" aria-label="Genre" placeholder="Genre" required />
    <input type="number" id="year" aria-label="Year" placeholder="Year" required />
    <button type="submit">Add Movie</button>
  </form>
  <p id="success" role="status"></p>
  <p id="error" class="error" role="alert"></p>

  <h2>Movies</h2>
  <button type="button" id="load-movies">Load Movies</button>
  <div class="table-wrapper">

  <table id="movie-table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Genre</th>
        <th>Year</th>
      </tr>
    </thead>
    <tbody id="movie-tbody"></tbody>
  </table>
  </div>
  </main>

  <script>
    const form = document.getElementById("movie-form");
    const tbody = document.getElementById("movie-tbody");
    const errorEl = document.getElementById("error");

    const successEl = document.getElementById("success");
    document.getElementById("load-movies").addEventListener("click", loadMovies);

    async function loadMovies() {
      try {
        const res = await fetch("/api/movies");
        const movies = await res.json();
        renderMovies(movies);
      } catch (err) {
        errorEl.textContent = "Failed to load movies.";
      }
    }

    function renderMovies(movies) {
      tbody.innerHTML = "";
      if (movies.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty">No movies yet.</td></tr>';
        return;
      }
      movies.forEach((movie) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${movie.id}</td>
          <td>${movie.title}</td>
          <td>${movie.genre}</td>
          <td>${movie.year}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.textContent = "";
      successEl.textContent = "";

      const newMovie = {
        title: document.getElementById("title").value.trim(),
        genre: document.getElementById("genre").value.trim(),
        year: parseInt(document.getElementById("year").value),
      };

      try {
        const res = await fetch("/api/movies", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(newMovie),
        });

        if (!res.ok) {
          const data = await res.json();
          errorEl.textContent = data.error || "Failed to add movie.";
          return;
        }

        successEl.textContent = "Movie added successfully";
        form.reset();
        loadMovies();
      } catch (err) {
        errorEl.textContent = "Failed to communicate with the server.";
      }
    });

  </script>
</body>
</html>
